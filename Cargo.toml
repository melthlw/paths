[package]
name = "paths"
version = "0.4.5"
edition = "2024"
authors = ["Lewis"]
description = "Vector graphics and illustration design studio for GNOME built with GTK4, Libadwaita, Skia and Rust"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/lewisHeart/paths"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gio = { version = "0.22.9", features = ["v2_80"] }
glib = "0.22.9"
cairo-rs = { version = "0.22.9", features = ["use_glib"] }
skia-safe = "0.153.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5+spec-1.1.0"
dirs = "7.0.0"
libloading = "0.9.0"
rstar = "0.13.0"


[build-dependencies]
glib-build-tools = "0.22.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

