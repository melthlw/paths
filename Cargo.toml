[package]
name = "gnome-paths"
version = "0.3.0"
edition = "2024"
authors = ["Lewis"]
description = "Vector graphics and illustration design studio for GNOME built with GTK4, Libadwaita, Skia and Rust"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/lewisHeart/gnome-paths"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gio = { version = "0.22.8", features = ["v2_80"] }
glib = "0.22.8"
cairo-rs = { version = "0.22.0", features = ["use_glib"] }
skia-safe = "0.99.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
dirs = "6.0.0"
libloading = "0.9.0"


[build-dependencies]
glib-build-tools = "0.22.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

