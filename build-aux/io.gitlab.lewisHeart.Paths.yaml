app-id: io.gitlab.lewisHeart.Paths
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: paths
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --metadata=X-DConf=migrate-path=/io/gitlab/lewisHeart/Paths/
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/paths/cargo
    RUST_BACKTRACE: '1'
    SKIA_BINARIES_URL: file:///run/build/paths/skia-binaries-b7f043e0b1e2a850e702-x86_64-unknown-linux-gnu-jpegd-jpege-pdf.tar.gz
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: paths
    buildsystem: "meson"
    sources:
      - type: dir
        path: ..
      - type: file
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.153.3/skia-binaries-b7f043e0b1e2a850e702-x86_64-unknown-linux-gnu-jpegd-jpege-pdf.tar.gz
        sha256: ef9ce238ee4e2939b1743f036f120d07405ecdbc0329857d554cc371ec8cd0b2
        dest-filename: skia-binaries-b7f043e0b1e2a850e702-x86_64-unknown-linux-gnu-jpegd-jpege-pdf.tar.gz
      - cargo-sources.json
