app-id: io.github.lewis.GnomePaths
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm19
command: gnome-paths
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --metadata=X-DConf=migrate-path=/io/github/lewis/GnomePaths/
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm19/bin
  env:
    CARGO_HOME: /run/build/gnome-paths/cargo
    RUST_BACKTRACE: '1'
    LIBCLANG_PATH: /usr/lib/sdk/llvm19/lib
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: gnome-paths
    buildsystem: "meson"
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
