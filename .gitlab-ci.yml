stages:
  - check
  - test
  - flatpak

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUST_BACKTRACE: "1"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

.rust-deps:
  image: rust:latest
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config libgtk-4-dev libadwaita-1-dev libclang-dev clang libssl-dev git

cargo-check:
  extends: .rust-deps
  stage: check
  script:
    - cargo check --verbose

cargo-test:
  extends: .rust-deps
  stage: test
  script:
    - cargo test --verbose

flatpak-build:
  stage: flatpak
  image: ghcr.io/flathub-infra/flatpak-builder:latest
  script:
    - flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - flatpak-builder --force-clean --repo=repo build-dir io.gitlab.lewisHeart.GnomePaths.json
    - flatpak build-bundle repo io.gitlab.lewisHeart.GnomePaths.flatpak io.gitlab.lewisHeart.GnomePaths
  artifacts:
    name: "io.gitlab.lewisHeart.GnomePaths-$CI_COMMIT_REF_NAME"
    paths:
      - io.gitlab.lewisHeart.GnomePaths.flatpak
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
