stages:
  - test
  - flatpak

variables:
  RUST_BACKTRACE: "1"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .flatpak-builder/cache
    - .flatpak-builder/downloads

.flatpak-setup:
  image: ghcr.io/flathub-infra/flatpak-builder:latest
  before_script:
    - flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08

flatpak-test:
  extends: .flatpak-setup
  stage: test
  script:
    - flatpak-builder --force-clean --build-only build-dir io.gitlab.lewisHeart.GnomePaths.json
    - flatpak-builder --run build-dir io.gitlab.lewisHeart.GnomePaths.json cargo test

flatpak-bundle:
  extends: .flatpak-setup
  stage: flatpak
  script:
    - flatpak-builder --force-clean --repo=repo build-dir io.gitlab.lewisHeart.GnomePaths.json
    - flatpak build-bundle repo io.gitlab.lewisHeart.GnomePaths.flatpak io.gitlab.lewisHeart.GnomePaths
  artifacts:
    name: "io.gitlab.lewisHeart.GnomePaths-$CI_COMMIT_REF_NAME"
    paths:
      - io.gitlab.lewisHeart.GnomePaths.flatpak
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
